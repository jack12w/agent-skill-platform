# ============================================================
# 宝塔 Nginx 主配置（http{} 内）片段 —— 限流 zone 定义（④ 第二道防线）
#
# 放置位置：宝塔面板 → 软件商店 → 已安装 → Nginx → 配置修改
#           在打开的 http { ... } 内部任意位置粘贴下面几行（全局只需一次）
#
# 前置：站点配置里必须用 limit_req 引用这些 zone（见 nginx-api-direct-proxy.conf）
#       若 zone 未定义就引用，Nginx 重载会失败。
#
# 说明：
#   - $binary_remote_addr = 直接连到宝塔 Nginx 的客户端 IP（当前架构下就是真实用户 IP）。
#     若将来在宝塔前再加 CDN/SLB，需改用 real_ip 模块或 $http_x_forwarded_for，否则会退化为共享桶。
#   - rate=2r/s ≈ 120 次/分钟，与后端 redis 限流阈值对齐；burst 允许短时突发不被误杀。
# ============================================================

# 读接口（GET/HEAD）：每真实客户端 IP 120 次/分钟，突发 20 个不延迟处理
limit_req_zone $binary_remote_addr zone=api_read:10m rate=2r/s;

# 写接口（POST/PUT/DELETE 等）：每 IP 60 次/分钟，突发 5（写操作更贵，限更严）
limit_req_zone $binary_remote_addr zone=api_write:10m rate=1r/s;

# 页面加载（可选，用于保护 1M 带宽）：每 IP 60 次/分钟
limit_req_zone $binary_remote_addr zone=site_read:10m rate=1r/s;

# 超限统一返回 429（与后端一致，便于前端做「加载失败+重试」UI）
limit_req_status 429;
