# ============================================================
# 宝塔 Nginx 规则：让 /api/ 直连 API 容器（绕过 Next.js）+ 边缘限流（④）
#
# 目的：
#   1) 真实客户端 IP 经 X-Forwarded-For 端到端到达 API，
#      激活 rate-limit.guard 的「每真实 IP 120/min」精确限流。
#   2) 在 Nginx 边缘再加一层限流，作为后端 Redis 限流的「第二道防线」，
#      异常/被攻击/Redis 故障时仍能于边缘拦截超额请求（返回 429）。
#
# 使用方式（宝塔面板）：
#   站点 → skills.rehomi.com → 设置 → 配置文件
#   在已有的 `location / { ... }` 之前插入下面的 `location /api/ { ... }` 块。
#   （Nginx 前缀匹配：/api/ 长于 /，/api/* 请求会命中此块而非反代到 web）
#
# 前置条件：
#   A. docker-compose.prod.yml 已为 api 服务加 127.0.0.1:3001:3001 端口映射（已提交），
#      并已在服务器执行：git pull && docker compose ... up -d --build
#   B. 把下面的 zone 定义加到 Nginx 主配置 http{} 内（见 nginx-limit-req-zones.conf）：
#        limit_req_zone $binary_remote_addr zone=api_read:10m rate=2r/s;
#        limit_req_zone $binary_remote_addr zone=api_write:10m rate=1r/s;   # 可选，本规则未引用
#        limit_req_status 429;
# ============================================================

    # ── Route B + ④：/api/ 直连 API 容器，并在边缘限流 ──
    location /api/ {
        # 所有方法统一限流：每 IP 120/min，突发 20 不延迟
        # 注意：nginx 不允许 limit_req 放在 limit_except 子块内，
        # 故写接口不再单独设更严阈值（后端 Redis 限流仍双层兜底）。
        limit_req zone=api_read burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001;   # 结尾无斜杠，保留 /api/ 前缀 → http://127.0.0.1:3001/api/...
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # 大响应（列表/排行榜）也允许
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 32k;
    }
