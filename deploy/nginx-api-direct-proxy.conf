# ============================================================
# 宝塔 Nginx 规则：让 /api/ 直连 API 容器（绕过 Next.js）
# 目的：真实客户端 IP 经 X-Forwarded-For 端到端到达 API，
#       激活 rate-limit.guard 的「每真实 IP 120/min」精确限流。
#
# 使用方式（宝塔面板）：
#   站点 → skills.rehomi.com → 设置 → 配置文件
#   在已有的 `location / { ... }` 之前插入下面的 `location /api/ { ... }` 块。
#   （Nginx 前缀匹配：/api/ 长于 /，/api/* 请求会命中此块而非反代到 web）
#
# 前置条件：docker-compose.prod.yml 已为 api 服务加 `127.0.0.1:3001:3001` 端口映射
#   （已提交），并已在服务器执行：
#     git pull && docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# ============================================================

    # ── Route B: /api/ 直连 API 容器（真实客户端 IP 经 XFF 到达 API） ──
    location /api/ {
        proxy_pass http://127.0.0.1:3001;   # 注意：结尾无斜杠，保留 /api/ 前缀 → http://127.0.0.1:3001/api/...
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # 大响应（列表/排行榜）也允许
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 32k;
    }
