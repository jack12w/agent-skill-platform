<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>插件授权</title>
  <link rel="stylesheet" href="activation.css" />
</head>
<body>
  <div class="sd-wrap">
    <header class="sd-head">
      <div class="sd-title">
        <span class="sd-dot" id="dot"></span>
        <span>插件授权</span>
      </div>
      <span class="sd-badge" id="badge">未授权</span>
    </header>

    <!-- 未授权：发起授权（无需填写任何密钥） -->
    <section class="sd-sec" id="secStart">
      <p class="sd-lead">
        点击下方按钮，会打开平台授权页；在网页上点一下「确认授权」即可完成，无需填写任何密钥。
      </p>
      <button class="sd-btn sd-btn-primary" id="btnStart">登录并激活</button>
    </section>

    <!-- 等待网页确认：展示授权码 -->
    <section class="sd-sec sd-hidden" id="secPending">
      <p class="sd-lead">请在新打开的页面完成确认。若没有自动打开，可手动访问授权页并输入下面的授权码：</p>
      <div class="sd-code-row">
        <code class="sd-code" id="codeText">--------</code>
        <button class="sd-btn sd-btn-mini" id="btnCopyCode">复制</button>
      </div>
      <p class="sd-hint">授权码 10 分钟内有效，过期后重新点「登录并激活」即可。</p>
      <div class="sd-row">
        <button class="sd-btn" id="btnOpenPage">打开授权页</button>
        <button class="sd-btn sd-btn-ghost" id="btnCheckNow">我已确认</button>
      </div>
      <p class="sd-hint" id="pendingTip">等待确认中…</p>
    </section>

    <!-- 已授权：展示状态 + 管理 -->
    <section class="sd-sec sd-hidden" id="secActive">
      <div class="sd-kv">
        <span class="sd-k">有效期至</span>
        <span class="sd-v" id="expText">—</span>
      </div>
      <div class="sd-kv">
        <span class="sd-k">剩余</span>
        <span class="sd-v" id="daysText">—</span>
      </div>
      <div class="sd-kv">
        <span class="sd-k">已授权设备</span>
        <span class="sd-v" id="devText">—</span>
      </div>
      <div class="sd-kv">
        <span class="sd-k">当前账号</span>
        <span class="sd-v sd-mono" id="userText">—</span>
      </div>
      <div class="sd-row">
        <button class="sd-btn" id="btnRefresh">刷新授权</button>
        <button class="sd-btn sd-btn-ghost" id="btnDeactivate">本机注销</button>
      </div>
    </section>

    <!-- 提示区：错误 / 引导 -->
    <section class="sd-alert sd-hidden" id="alertBox">
      <p class="sd-alert-msg" id="alertMsg"></p>
      <a class="sd-alert-link sd-hidden" id="alertLink" href="#" target="_blank" rel="noreferrer"></a>
    </section>

    <footer class="sd-foot">
      <a href="#" id="portalLink2" target="_blank" rel="noreferrer">管理订阅 / 解绑设备</a>
    </footer>
  </div>

  <script type="module" src="activation.js"></script>
</body>
</html>
